<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Barra lateral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<aside aria-label="Navegação principal" style="width:240px;height:100%;min-height:900px;box-sizing:border-box;background:#ffffff;border-right:1px solid #e2e3dc;display:flex;flex-direction:column;gap:24px;padding:24px 16px;font-family:Inter,system-ui,'Segoe UI',sans-serif;color:#2b2e2c">
<div style="display:flex;align-items:center;gap:10px;padding:0 8px">
<span style="width:12px;height:12px;border-radius:50%;background:#4f7a5e;box-shadow:0 0 0 4px #e7efe9"></span>
<span style="font-size:16px;line-height:24px;font-weight:600;letter-spacing:-0.01em">Sinal Verde</span>
</div>
<nav style="display:flex;flex-direction:column;gap:4px">
<a href="Inicio.dc.html" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:15px;line-height:22px;font-weight:{{wInicio}};color:#2b2e2c;background:{{bgInicio}}"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a>
<a href="VisaoGeral.dc.html" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:15px;line-height:22px;font-weight:{{wFin}};color:#2b2e2c;background:{{bgFin}}"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>Finanças</a>
<a href="#" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:15px;line-height:22px;color:#2b2e2c"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="m3 17 6-6 4 4 8-8"></path><path d="M14 7h7v7"></path></svg>Investimentos</a>
<a href="#" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:15px;line-height:22px;color:#2b2e2c"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M3 21h18M5 21v-9M10 21v-9M14 21v-9M19 21v-9M2 10l10-6 10 6z"></path></svg>Patrimônio</a>
</nav>
<div style="flex:1"></div>
<nav aria-label="Sistema" style="display:flex;flex-direction:column;gap:4px;border-top:1px solid #e2e3dc;padding-top:16px">
<a href="#" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:15px;line-height:22px;color:#5f6661"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="12" cy="12" r="3"></circle><path d="M12 9V7M15 12h2"></path></svg>Cofre</a>
<a href="#" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:15px;line-height:22px;color:#5f6661"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Ajustes</a>
</nav>
<a href="VisaoGeral.dc.html" aria-label="Livre hoje: abre a Visão geral de Finanças" style="display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:12px;text-decoration:none;background:{{toneBg}};color:{{toneFg}}">
<span style="font-size:12px;line-height:16px;font-weight:500;text-transform:uppercase;letter-spacing:.06em">{{toneMark}} {{toneWord}}</span>
<span style="font-size:24px;line-height:32px;font-weight:600;letter-spacing:-0.01em;font-variant-numeric:tabular-nums">{{livre}}</span>
<span style="font-size:13px;line-height:18px;font-weight:500">livres hoje</span>
</a>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","financas"],"default":"financas"},"tone":{"editor":"enum","options":["verde","amarelo","vermelho"],"default":"verde"},"livre":{"editor":"text","default":"R$ 82,40"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'financas';
const tone = this.props.tone ?? 'verde';
const tones = {
verde: { bg: '#e4efe7', fg: '#2f6243', mark: '●', word: 'Dentro do livre' },
amarelo: { bg: '#f7eed0', fg: '#765500', mark: '▲', word: 'Perto do limite' },
vermelho: { bg: '#f6e3df', fg: '#9a3324', mark: '■', word: 'Passou do livre' }
};
const t = tones[tone] || tones.verde;
const on = '#e7efe9';
return {
livre: this.props.livre ?? 'R$ 82,40',
bgInicio: active === 'inicio' ? on : 'transparent',
wInicio: active === 'inicio' ? 600 : 400,
bgFin: active === 'financas' ? on : 'transparent',
wFin: active === 'financas' ? 600 : 400,
toneBg: t.bg, toneFg: t.fg, toneMark: t.mark, toneWord: t.word
};
}
}
</script>
</body>
</html>
